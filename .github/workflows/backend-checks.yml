name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_EC2_METADATA_DISABLED: "true"
  FLASK_SKIP_DOTENV: "1"

jobs:
  sqlite:
    name: Backend / SQLite and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint backend and tests
        run: python -m ruff check src tests
      - name: Check offline imports and SQLite transactions
        run: python -m pytest

  postgresql:
    name: Backend / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: triage_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: triage_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triage_test -d triage_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Public dummy credentials belong only to this disposable CI service.
      TEST_DATABASE_URL: postgresql+psycopg://triage_test:synthetic_ci_only@127.0.0.1:5432/triage_lab_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check PostgreSQL migrations, transactions, roles, and fixture CLI
        run: python -m pytest
